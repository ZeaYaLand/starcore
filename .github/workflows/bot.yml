name: STARCORE Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'handlers/**'
      - 'services/**'
      - 'database/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout 60s python bot.py || test $? -eq 124

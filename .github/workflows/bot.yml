name: STARCORE Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot.py'
      - 'handlers/**'
      - 'services/**'
      - 'database/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Telegram API token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["BOT_TOKEN"]
          if not token:
              raise SystemExit("BOT_TOKEN is empty")

          url = f"https://api.telegram.org/bot{token}/getMe"
          with urllib.request.urlopen(url, timeout=15) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise SystemExit(f"Telegram getMe failed: {data}")

          result = data["result"]
          print(f"Telegram API OK: username=@{result.get('username')}, id={result.get('id')}")
          PY

      - name: Start bot with diagnostics
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout 60s python -u bot.py || test $? -eq 124
